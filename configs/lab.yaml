# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: G01
owner: "Đoàn Quang Minh (Data QC owner)"   # mandatory for every Decision
track_config: tracks/t02.yaml     # pick your challenge: tracks/t01.yaml ... tracks/t14.yaml
track: t02                        # must match track_config
input: fixtures/t02_raw_qc        # or data/real/... if your instructor provided a real pack
output: out/
seed: 42
offline: true                     # demo/eval must not touch the network
strict_provenance: true           # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). Freeze before evaluation.
params:
  budget: 20                  # review budget B (= eval budget)
  # --- PoC scoring (src/t02_features.py); frozen from dev self-labels, never tuned on eval
  grid: 4
  sat_level: 245
  blur_decades: 1.0
  dark_stops: 2.0
  bright_stops: 1.0
  glare_cell_frac: 0.05
  block_base: 1.0
  block_scale: 0.8
  min_group: 4
  action_threshold: 1.0
  # --- batch decision policy
  max_recapture_rate: 0.5
  # --- baseline (src/baseline_t02.py): one global Laplacian threshold, chosen on dev
  baseline_lap_threshold: 100
